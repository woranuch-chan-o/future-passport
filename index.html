<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#EAF6FF">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Future Passport · BA&amp;IT EXPO 2027</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://api.line.me">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@700&family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9EBFA; --surface:#FFFFFF; --surface-2:#F3F2FF; --text:#191340; --muted:#5E5987; --line:#DCD9F2;
  --night:#120D46; --night-2:#2A1488; --violet:#5B2EE6; --blue:#2F6BFF; --magenta:#E2399E;
  --gold:#FFB72B; --mint:#13B58C; --danger:#C92A45;
  --head:"Prompt","Leelawadee UI","Tahoma",sans-serif;
  --body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06051C; --surface:#151139; --surface-2:#1D184F; --text:#F1F0FF; --muted:#ABA6D8; --line:#2D2770; --danger:#FF6B82;
  }
}
:root[data-theme="dark"]{
  --bg:#06051C; --surface:#151139; --surface-2:#1D184F; --text:#F1F0FF; --muted:#ABA6D8; --line:#2D2770; --danger:#FF6B82;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{max-width:100%}
svg.lucide{width:1.15em;height:1.15em;stroke-width:2.2;vertical-align:-0.2em}

/* ---------- stage ---------- */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;max-width:1080px;margin:0 auto;padding:28px 24px;align-items:center}
.mbrief h1{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.1;margin:0 0 10px;letter-spacing:-.01em}
.mbrief .lead{color:var(--muted);max-width:44ch;margin:0 0 22px}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.rules h2{font-family:var(--head);font-size:17px;margin:0 0 8px}
.rules ul{margin:0;padding-left:18px}
.rules li{margin:3px 0}
.demo-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:14px}

.phone{position:relative;height:min(860px,100%);width:100%;background:var(--surface-2);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 10px var(--night),0 30px 60px -20px rgba(18,13,70,.55)}
.liff-bar{flex:none;display:flex;align-items:center;gap:8px;padding:14px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.liff-bar .t{flex:1;font-family:var(--head);font-weight:600;font-size:15px;text-align:center}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.icon-btn[hidden]{visibility:hidden;display:grid}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px}
.info-fab{display:none}

@media (max-width:820px){
  .stage{display:block;padding:0;max-width:none}
  .mbrief{display:none}
  .brief.open{display:block;position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
  .phone{height:100%;border-radius:0;box-shadow:none}
  .liff-bar{padding-top:12px}
  .info-fab{display:grid}
}

/* ---------- brand blocks ---------- */
.hero{position:relative;border-radius:22px;padding:18px;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,#E2399E 0%,rgba(226,57,158,0) 55%),linear-gradient(150deg,#2F6BFF 0%,#2A1488 55%,#120D46 100%)}
.hero::after{content:"";position:absolute;inset:auto -10% -40% auto;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.hero .kicker{font-family:var(--head);font-weight:600;font-size:13px;opacity:.85}
.wordmark{font-family:var(--head);font-weight:800;font-size:30px;line-height:1;letter-spacing:.02em;margin:4px 0 6px;
  background:linear-gradient(90deg,#fff 0%,#C9D8FF 60%,#FFC4E6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;opacity:.9;font-size:14px}

.pass{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:20px}
.pass .nm{font-family:var(--head);font-weight:600;font-size:16px;line-height:1.25}
.pass .sc{font-size:12.5px;opacity:.85}
.grp{font-family:var(--head);font-weight:700;background:var(--gold);color:#2B1700;border-radius:10px;padding:4px 10px;font-size:13px;white-space:nowrap}
.pts{display:flex;align-items:baseline;gap:6px;margin:16px 0 8px}
.pts b{font-family:var(--head);font-size:44px;line-height:1;font-weight:800}
.segs{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.segs i{height:8px;border-radius:4px;background:rgba(255,255,255,.22)}
.segs i.on{background:var(--gold)}
.segs i.goal{box-shadow:inset 0 0 0 2px rgba(255,183,43,.9)}
.prog-note{font-size:13px;margin-top:8px;opacity:.95}

/* rich menu */
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;background:var(--night);padding:8px;border-radius:20px}
.tile{border:0;border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#1A1446;min-height:104px;justify-content:center}
.tile svg.lucide{width:28px;height:28px;stroke-width:2}
.tile .en{font-family:var(--head);font-weight:700;font-size:11.5px;letter-spacing:.02em;line-height:1.15}
.tile .th{font-size:11.5px;color:#4A4470;line-height:1.2}
.t1{background:#E7DDFF}.t2{background:#D9E6FF}.t3{background:#FFDDF0}.t4{background:#DCF5EC}.t5{background:#FFEBC7}.t6{background:#E2E8FF}
.tile.t3{outline:2px solid #E2399E;outline-offset:-2px}

/* generic */
h2.sec{font-family:var(--head);font-weight:700;font-size:20px;margin:4px 0 4px;line-height:1.25}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack>*+*{margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:13px 16px;font-family:var(--head);font-weight:600;font-size:15.5px;background:var(--blue);color:#fff}
.btn.alt{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2B1700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* chat */
.chat{display:flex;gap:10px;align-items:flex-start}
.oa{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#2F6BFF,#5B2EE6);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:12px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;max-width:290px}
.bubble .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.bubble p{margin:0 0 10px}

/* form */
label.f{display:block;font-size:13.5px;font-weight:600;margin:12px 0 5px}
input.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}

/* scanner */
.viewfinder{position:relative;aspect-ratio:1/1;border-radius:22px;background:#0A0826;overflow:hidden;display:grid;place-items:center}
.viewfinder .fr{position:absolute;inset:16%;border-radius:18px}
.viewfinder .fr::before,.viewfinder .fr::after{content:"";position:absolute;width:44px;height:44px;border:4px solid #3DF2C4}
.viewfinder .fr::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.viewfinder .fr::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.scanline{position:absolute;left:16%;right:16%;height:2px;background:#3DF2C4;box-shadow:0 0 12px #3DF2C4;top:16%;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:84%}}
.viewfinder .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#D6DCFF;font-size:13px}
.vf-busy{position:absolute;inset:0;background:rgba(10,8,38,.75);display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:600}
.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qr-chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.2;text-align:center}
.qr-chip b{font-family:var(--head);font-size:18px}
.qr-chip.done{background:var(--surface-2);color:var(--muted)}
.qr-chip.done b::after{content:" ✓";color:var(--mint)}

/* badges */
.hex{--c:#5B2EE6;width:76px;aspect-ratio:1/1.12;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000));display:grid;place-items:center;color:#fff}
.hex svg.lucide{width:34px;height:34px}
.hex.locked{background:var(--line);color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25}
.badge .bn{font-weight:600}
.badge .bt{color:var(--muted);font-size:11px}

.result{text-align:center;padding-top:8px}
.result .hex{width:140px;margin:6px auto 0}
.result .hex svg.lucide{width:62px;height:62px}
.burst{position:relative;display:inline-block}
.burst::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(255,183,43,.45),rgba(255,183,43,0) 65%)}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.result h2{font-family:var(--head);font-weight:800;font-size:26px;margin:18px 0 2px}
.plus{display:inline-block;font-family:var(--head);font-weight:800;font-size:22px;color:var(--mint);margin:4px 0 6px}
.unlock{background:linear-gradient(120deg,#FFF1CF,#FFE0F1);color:#2B1700;border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}
.unlock svg.lucide{width:30px;height:30px;flex:none;color:#C9520F}

/* lists */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.num{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--head);font-weight:700;color:#fff}
.mlist .mt{font-family:var(--head);font-weight:600;font-size:14.5px;line-height:1.25}
.mlist .md{font-size:12.5px;color:var(--muted)}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.st.wait{background:var(--surface-2);color:var(--muted)}

/* city map */
.city{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--night);border-radius:20px;padding:10px}
.block{border:0;border-radius:12px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:11.5px;line-height:1.2;text-align:center;padding:6px}
.block b{font-family:var(--head);font-size:22px;line-height:1}
.block.sel{outline:3px solid #fff;outline-offset:-3px}
.block.done{opacity:.55}
.gate{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin:8px 4px 0}

/* rewards */
.tier{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.tier .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.tier .ic svg.lucide{width:26px;height:26px}
.tier h3{font-family:var(--head);font-size:15.5px;margin:0;line-height:1.25}
.tier p{margin:0;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}

/* certificate */
.certimg{position:relative;width:100%;aspect-ratio:3508/2480;container-type:inline-size;background:#fff url("cert-bg.jpg") center/100% 100% no-repeat;border-radius:6px;box-shadow:0 8px 24px -10px rgba(18,13,70,.45);color:#1C1640;font-family:var(--body);overflow:hidden}
.certimg>div{position:absolute;line-height:1.2}
.certimg .ctr{left:0;right:0;text-align:center}
.c-title{top:46.9%;font-family:var(--head);font-weight:800;font-size:3.6cqw;color:#2A1488}
.c-sub{top:53.3%;font-family:var(--head);font-weight:600;font-size:1.35cqw;letter-spacing:.2em;color:#A8761A}
.c-to{top:57.4%;font-size:1.5cqw;color:#5E5987}
.c-name{top:60.3%;font-family:var(--head);font-weight:700;font-size:3.8cqw;color:#120D46}
.c-school{top:67.4%;font-size:1.8cqw;font-weight:600}
.c-body{top:71.9%;left:20%!important;right:20%!important;font-size:1.45cqw;line-height:1.5!important;text-align:center}
.c-sig{top:87%;left:18%;width:26%;text-align:center;font-size:1.15cqw;border-top:.12cqw solid #1C1640;padding-top:.6cqw;color:#3E3970}
.c-sig b{display:block;font-weight:600;color:#1C1640}
.c-no{top:86.6%;right:21.4%;text-align:right;font-size:1.15cqw;color:#5E5987}
.c-no b{display:block;font-family:var(--head);font-weight:700;font-size:1.5cqw;color:#120D46}
.c-qr{left:81.9%;top:74.6%;width:11.8%;aspect-ratio:1/1;line-height:0}
.c-qr img,.c-qr canvas{width:100%!important;height:100%!important}
.cert-view{position:fixed;inset:0;z-index:90;background:#06051C;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.cv-top{display:flex;justify-content:space-between;gap:8px;padding:10px 12px}
.cv-btn{border:0;border-radius:999px;padding:8px 16px;background:#fff;color:#120D46;font-family:var(--head);font-weight:600;font-size:15px}
.cv-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;min-height:0}
.cv-stage .loading{color:#A9A4D6;min-height:0}
.cv-img{display:block;max-width:96vw;max-height:calc(100vh - 210px);width:auto;height:auto;border-radius:6px}
.cv-img.rot{position:absolute;left:50%;top:50%;max-width:none;max-height:none;width:min(calc(100vh - 210px),134vw);transform:translate(-50%,-50%) rotate(90deg)}
.cv-bar{padding:10px 16px 16px}
.cert-photo{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 8px 24px -10px rgba(18,13,70,.45)}
.cv-hint{color:#A9A4D6;font-size:12.5px;line-height:1.5;text-align:center;margin:8px 0 0}
.cert-full{position:fixed;inset:0;z-index:80;background:rgba(6,5,28,.92);display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.cert-full .certimg{width:min(94vw,1100px)}
@media (orientation:portrait){.cert-full .certimg{width:min(92vh,1100px);transform:rotate(90deg)}}
.cert-full .x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:81;border:0;border-radius:999px;padding:8px 14px;background:#fff;color:#120D46;font-family:var(--head);font-weight:600}
.qrbox{background:#fff;padding:6px;border-radius:8px;line-height:0;overflow:hidden;font-size:9px;word-break:break-all}
.qrbox img,.qrbox canvas{width:84px!important;height:84px!important}

/* sheet & toast */
.scrim{position:absolute;inset:0;background:rgba(10,8,38,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.redeem-qr{display:grid;place-items:center;margin:10px 0}
.redeem-qr .qrbox img,.redeem-qr .qrbox canvas{width:150px!important;height:150px!important}
.code{font-family:var(--head);font-weight:700;text-align:center;font-size:18px;letter-spacing:.08em}
.toast{position:absolute;left:16px;right:16px;bottom:18px;background:var(--night);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;z-index:30;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (prefers-reduced-motion:reduce){
  .scanline,.pop{animation:none}
}

html,body{height:100%}
.phone{height:100%;max-width:560px;margin:0 auto;border-radius:0;box-shadow:none}
.liff-bar{padding-top:calc(env(safe-area-inset-top,0px) + 10px)}
.loading{display:grid;place-items:center;align-content:center;min-height:60vh;text-align:center;color:var(--muted);gap:12px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:14px;line-height:1.45}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--violet)}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0 2px;font:inherit;cursor:pointer}
.codein{display:flex;gap:8px}
.codein .in{text-transform:uppercase;letter-spacing:.25em;font-family:var(--head);font-weight:700;text-align:center;font-size:18px}
.viewfinder .hint{padding:0 12px}

/* ================= GAMING THEME ================= */
:root,:root[data-theme],:root:not([data-theme="light"]){
  --bg:#070B1F;--surface:#0F1533;--surface-2:#0A0F28;--text:#EAF2FF;--muted:#93A6DA;--line:#24305E;
  --cyan:#22E4FF;--magenta:#FF3EA5;--lime:#A6FF3D;--gold:#FFC83D;--violet:#8B5CFF;--danger:#FF5C7A;
  --blue:#2F6BFF;--mint:#3DF2C4;
  --head:"Chakra Petch","Prompt","Leelawadee UI",sans-serif;
  --glow-c:0 0 0 1px rgba(34,228,255,.55),0 0 18px rgba(34,228,255,.35);
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
html,body{background:var(--bg);color:var(--text)}
.phone{background:
  radial-gradient(60% 40% at 100% 0%,rgba(255,62,165,.20),transparent 70%),
  radial-gradient(60% 40% at 0% 100%,rgba(34,228,255,.16),transparent 70%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 32px),

/* ===== helpers ===== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtTime(iso){if(!iso)return "";var d=new Date(iso);return d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";}
function missions(){return (S&&S.missions||[]).filter(function(m){return activeIds().indexOf(Number(m.id))>=0;}).map(function(m){var st=STYLE[m.id]||["star","#5B2EE6"];return Object.assign({},m,{icon:st[0],c:st[1]});});}
function mission(id){return missions().filter(function(m){return m.id===Number(id);})[0];}
function done(id){return S&&S.scans&&S.scans[String(id)];}
function count(){return S?S.count:0;}
function certMin(){return (S&&S.settings&&S.settings.certMin)||9;}
function reqList(){return (S&&S.settings&&S.settings.requiredStations)||[1,2,3,4,5,6,7,8,9];}
function dayNo(){return (S&&S.settings&&S.settings.day)||1;}
function activeIds(){return (S&&S.settings&&S.settings.activeStations)||[1,2,3,4,5,6,7,8,9];}
function totalSt(){return activeIds().length;}
function optList(){return activeIds().filter(function(i){return !isReq(i);});}
function isReq(id){return reqList().indexOf(Number(id))>=0;}
function reqLeft(){return reqList().filter(function(n){return !done(n);});}
function reqDone(){return reqList().length-reqLeft().length;}
function optNeed(){return Math.max(0,certMin()-reqList().length);}
function optDone(){return optList().filter(function(n){return done(n);}).length;}
function optLeft(){return Math.max(0,optNeed()-optDone());}
function leftTotal(){return reqLeft().length+optLeft();}
function reqComplete(){return !!S&&leftTotal()===0;}
function leftText(){var p=[];if(reqLeft().length)p.push((optList().length?"ฐานบังคับ ":"ฐาน ")+reqLeft().join(", "));if(optLeft())p.push("เลือกอีก "+optLeft()+" ฐานจากฐาน "+optList().join(", "));return p.join(" + ");}
function pts(){return S?S.points:0;}

function api(action,payload){
  var body=Object.assign({action:action,idToken:liff.getIDToken()},payload||{});
  return fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify(body)})
    .catch(function(){var e=new Error("เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่");e.code="NETWORK";throw e;})
    .then(function(r){return r.text().then(function(t){
      try{return JSON.parse(t);}catch(x){
        var m=t.match(/<title>([^<]*)<\/title>/i);
        var e=new Error("ระบบตอบกลับผิดรูปแบบ"+(m?" ("+m[1].trim()+")":"")+" ลองใหม่อีกครั้ง");
        e.code="BAD_RESPONSE";throw e;
      }});})
    .then(function(j){
      if(!j.ok){ if(j.code==="AUTH_EXPIRED") relogin(); var e=new Error(j.message||"เกิดข้อผิดพลาด");e.code=j.code;throw e; }
      lastFetch=Date.now();
      if(j.data&&j.data.registered!==undefined) remember(j.data); else if(j.data&&j.data.state) remember(j.data.state);
      return j.data;
    });
}
function relogin(){
  try{ if(sessionStorage.getItem("fp-relogin")) return; sessionStorage.setItem("fp-relogin","1"); }catch(e){}
  if(liff.isInClient()) location.reload(); else { liff.logout(); liff.login({redirectUri:location.href}); }
}

var stack=[], $screen, $title, $back, $home, $phone;
function go(name,params,replace){ if(replace) stack.pop(); stack.push({name:name,params:params||{}}); draw(); }
function back(){ if(stack.length>1){stack.pop();draw();} }
function draw(){
  closeSheet();
  var cur=stack[stack.length-1], v=VIEWS[cur.name](cur.params);
  $title.textContent=v.title||"Future Passport";
  $back.hidden=stack.length<2||!!v.noBack;
  $home.hidden=!S||!S.registered||cur.name==="home"||cur.name==="register";
  $screen.innerHTML=v.html; $screen.scrollTop=0;
  if(window.lucide) lucide.createIcons();
  if(v.after) v.after();
}
function busy(msg){
  $back.hidden=true; $home.hidden=true;
  $screen.innerHTML='<div class="loading"><div class="spinner"></div><div>'+esc(msg||"กำลังโหลด…")+'</div></div>';

function fatal(title,msg){

function qrSvg(text){
  if(!window.qrcode) return "";
  var q=qrcode(0,"M");q.addData(text);q.make();var n=q.getModuleCount(),m=2,size=n+m*2,d="";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" style="width:100%;height:100%"><rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+d+'" fill="#120D46"/></svg>';
}

function parseQr(v){
  if(!v) return null;
  try{
    var u=new URL(v), s=u.searchParams.get("s"), k=u.searchParams.get("k");
    if(!s){var st=u.searchParams.get("liff.state");if(st){var q=new URLSearchParams(st.split("?")[1]||"");s=q.get("s");k=q.get("k");if(q.get("p")==="register")return {register:true};}}
    if(s&&k) return {station:Number(s),key:k};
    if(u.searchParams.get("p")==="register") return {register:true};
    return null;
  }catch(e){}
  var code=String(v).trim().toUpperCase();
  return /^[A-Z0-9]{6}$/.test(code)?{code:code}:null;
}
function doScan(p){
  if(!stack.length) stack.push({name:"home",params:{}});
  busy("กำลังบันทึกภารกิจ…");
  var prev=S?Object.keys(S.scans||{}):[], prevCert=!!(S&&S.cert);
  api("scan",p).then(function(r){S=r.state;go("result",r);})
  .catch(function(e){
    if(e.code!=="BAD_RESPONSE") throw e;
    return api("me").then(function(d){
      var added=Object.keys(d.scans||{}).filter(function(k){return prev.indexOf(k)<0;});
      if(!added.length) throw e;
      S=d; go("result",{station:Number(added[0]),dup:false,newCert:!!d.cert&&!prevCert,newSpecial:d.count===totalSt(),state:d});
    });
  })
  .catch(function(e){
    if(e.code==="NOT_REGISTERED"){pending=p;stack=[];go("register");toast("ลงทะเบียนก่อน แล้วระบบจะบันทึกฐานนี้ให้ต่อ","info");return;}
    go("result",{error:e.message,code:e.code});
  });
}

    if($("rPriv")) $("rPriv").onclick=function(){openUrl(ps);};

    $("rGo").onclick=function(){
      var name=$("rName").value.replace(/\s+/g," ").trim(), school=$("rSchool").value.replace(/\s+/g," ").trim(), comp=$("rComp").value, err=$("rErr");

      if(status==="competitor"&&!comp){err.textContent="เลือกรายการที่เข้าแข่งขัน";return;}
      if(name.length<3){err.textContent="กรอกชื่อ–นามสกุล";return;}
      if(!role){err.textContent="เลือกสถานะ (นักเรียน / ครู / บุคคลทั่วไป)";return;}
      if(role!=="บุคคลทั่วไป"&&school.length<3){err.textContent="กรอกชื่อสถานศึกษา";return;}
      if(!$("rProv").value){err.textContent="เลือกจังหวัด";return;}
      if(role==="นักเรียน"&&!$("rLevel").value){err.textContent="เลือกระดับการศึกษา";return;}
      if(role==="นักเรียน"&&!$("rYear").value){err.textContent="เลือกชั้นปี";return;}
      if(!$("rNews").checked){err.textContent="ติ๊กยินยอมการเก็บและใช้ข้อมูลส่วนบุคคลก่อนลงทะเบียน";return;}
      err.textContent=""; var btn=this; btn.disabled=true; btn.textContent="กำลังลงทะเบียน…";
      api("register",{name:name,role:role,school:school,level:role==="นักเรียน"?$("rLevel").value:"",year:role==="นักเรียน"?$("rYear").value:"",province:$("rProv").value,status:status,competition:status==="competitor"?comp:"",

        consentNews:$("rNews").checked,walkin:status==="walkin"})
      .then(function(d){
        S=d;
        if(pending){var p=pending;pending=null;stack=[];doScan(p);toast("ลงทะเบียนสำเร็จ");return;}
        stack=[];go("home",{fresh:1});
      })

        if(e.code!=="BAD_RESPONSE") throw e;
        return api("me").then(function(d){ if(!d.registered) throw e; S=d;
          if(pending){var p=pending;pending=null;stack=[];doScan(p);toast("ลงทะเบียนสำเร็จ");return;}
          stack=[];go("home",{fresh:1}); });
      })
      .catch(function(e){err.textContent=e.message;btn.disabled=false;btn.textContent="ลงทะเบียน";});
    };
  }};
};

VIEWS.scan=function(){
  return {title:"Scan Mission",html:

  }};

function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error("โหลดภาพพื้นหลังไม่สำเร็จ"));};i.src=src;});}
var certCache={key:"",url:""};
function certKey(){return ["v2570d",S.cert.day,S.cert.no,S.user.name,S.cert.issuedAt].join("|");}
function renderCert(){

}

/* ===== วาดข้อความบน canvas ให้ตรงตำแหน่งทุกเครื่อง (iOS วัดความกว้างอักษรไทยบน canvas ผิด จึงวัดผ่าน DOM แทน) ===== */
function textW(str,font,ls){
  var el=textW.el;if(!el){el=textW.el=document.createElement("span");el.setAttribute("aria-hidden","true");el.style.cssText="position:fixed;left:-99999px;top:0;white-space:pre;visibility:hidden;pointer-events:none";document.body.appendChild(el);}
  el.style.font=font;el.style.letterSpacing=(ls||0)+"px";el.textContent=str;
  return el.getBoundingClientRect().width;
}
function drawTxt(x,str,px,py,font,align,ls){
  if("letterSpacing" in x)x.letterSpacing=(ls||0)+"px";
  x.font=font;var w=textW(str,font,ls);
  x.textAlign="left";x.fillText(str,align==="center"?px-w/2:align==="right"?px-w:px,py);
  return w;
}
function fitFont(str,weight,size,fam,maxW,ls){var fs=size;while(textW(str,weight+" "+fs+"px "+fam,ls)>maxW&&fs>14)fs*=0.95;return weight+" "+fs+"px "+fam;}

function renderCertRaw(){
  var fl=(document.fonts&&document.fonts.load)?document.fonts.load('700 60px Sarabun',"เกียรติบัตร Aa").catch(function(){}):Promise.resolve();
  return fl.then(function(){return loadImg("cert-bg-2570.jpg");}).then(function(bg){
    var W=3508,H=2481,z=W/841.92,k=2.797,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
    x.drawImage(bg,0,0,W,H);
    var F='"Sarabun","TH Sarabun New","Leelawadee UI",Tahoma,sans-serif';
    function txt(str,cy,pt,color,maxW){var font=fitFont(str,"700",pt*k,F,maxW);x.fillStyle=color;x.textBaseline="middle";drawTxt(x,str,W/2,cy*z,font,"center");}
    // ข้อความที่เปลี่ยนตามผู้รับ (ตำแหน่ง/ขนาดตามแม่แบบ PDF)
    txt(S.user.name,221,36,"#002060",W*0.72);
    txt("ได้เข้าร่วม การแข่งขันทักษะวิชาการด้านบริหารธุรกิจระดับชาติ ครั้งที่ 4",258.5,18,"#002060",W*0.6);
    var d14=(S.cert.day||dayNo())===2;
    txt("ให้ไว้ ณ วันที่ "+(d14?"14":"13")+" มกราคม 2570",358,18,"#000000",W*0.4);
    // QR ตรวจสอบ + เลขที่วุฒิบัตร (มุมขวาล่าง)
    var qs=Math.round(76*z),qx=Math.round(738*z),qy=Math.round(452*z),pad=Math.round(6*z);
    x.fillStyle="rgba(255,255,255,.96)";x.beginPath();if(x.roundRect)x.roundRect(qx-pad,qy-pad,qs+pad*2,qs+pad*2+Math.round(26*z),Math.round(8*z));else x.rect(qx-pad,qy-pad,qs+pad*2,qs+pad*2+Math.round(26*z));x.fill();
    if(window.qrcode){var q=qrcode(0,"M");q.addData(S.settings.verifyUrl+"?cert="+encodeURIComponent(S.cert.no));q.make();var n=q.getModuleCount(),cell=qs/n;x.fillStyle="#002060";
      for(var r=0;r<n;r++)for(var kk=0;kk<n;kk++)if(q.isDark(r,kk))x.fillRect(qx+kk*cell,qy+r*cell,Math.ceil(cell),Math.ceil(cell));}
    x.fillStyle="#002060";x.textBaseline="middle";
    drawTxt(x,"เลขที่ "+S.cert.no,qx+qs/2,qy+qs+Math.round(10*z),fitFont("เลขที่ "+S.cert.no,"700",10*k,F,qs+pad*2-8),"center");
    x.fillStyle="#3A4A6B";drawTxt(x,"สแกนเพื่อตรวจสอบ",qx+qs/2,qy+qs+Math.round(20*z),"700 "+(8*k)+"px "+F,"center");
    return c.toDataURL("image/jpeg",0.9);
  });
}
function dataUrlToBlob(u){var p=u.split(","),b=atob(p[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:"image/jpeg"});}

function srcToBlob(src){
  if(/^data:/.test(src)) return Promise.resolve(dataUrlToBlob(src));
  return fetch(src).then(function(r){if(!r.ok)throw new Error("โหลดภาพไม่สำเร็จ");return r.blob();});
}
function openImageViewer(srcOrPromise,fileName,rotDefault,ext){
  var o=document.createElement("div");o.className="cert-view";o.setAttribute("role","dialog");o.setAttribute("aria-label","ดูภาพขนาดเต็ม");
  o.innerHTML='<div class="cv-top"><button class="cv-btn" id="cvClose">ปิด</button><button class="cv-btn" id="cvRot">หมุนภาพ</button></div>'+
    '<div class="cv-stage" id="cvStage"><div class="loading"><div class="spinner"></div><div>กำลังเตรียมภาพ…</div></div></div>'+
    '<div class="cv-bar"><button class="btn gold" id="cvSave" disabled>บันทึกรูปลงเครื่อง</button><p class="cv-hint" id="cvHint">ถ้าปุ่มบันทึกไม่ทำงาน ให้แตะค้างที่รูปแล้วเลือก "บันทึกรูปภาพ" หรือแคปหน้าจอเก็บไว้</p></div>';
  document.body.appendChild(o);
  var rot=!!rotDefault, img=null;
  function close(){o.remove();document.removeEventListener("keydown",key);}
  function key(e){if(e.key==="Escape")close();}
  document.addEventListener("keydown",key);
  o.querySelector("#cvClose").onclick=close;
  o.querySelector("#cvRot").onclick=function(){rot=!rot;if(img)img.className="cv-img"+(rot?" rot":"");};
  Promise.resolve(srcOrPromise).then(function(src){
    img=new Image(); img.src=src; img.alt=fileName; img.className="cv-img"+(rot?" rot":"");
    var st=o.querySelector("#cvStage"); st.innerHTML=""; st.appendChild(img);
    var btn=o.querySelector("#cvSave"); btn.disabled=false;
    btn.onclick=function(){ saveImage(src,fileName,ext,o.querySelector("#cvHint"),btn); };
  }).catch(function(e){o.querySelector("#cvStage").innerHTML='<p class="cv-hint">'+esc(e&&e.message||"เปิดภาพไม่สำเร็จ")+'</p>';});
}

  } else if(step===3){

  } else if(step===5){

    cnt("m1r",100);cnt("m2",200);cnt("m6",200);

      var n=inp.name;

      [].forEach.call(document.querySelectorAll('.mopt input[name="'+n+'"]'),function(x){x.parentNode.classList.toggle("on",x.checked);});

      if($("m4o"))$("m4o").style.display=a.m4.indexOf("อื่น ๆ (ระบุ)")>=0?"block":"none";

      if(step===0){a.name=$("mName").value.trim();a.school=$("mSchool").value.trim();a.consent=$("mConsent").checked;}
      if($("m1r"))a.m1r=$("m1r").value.trim(); if($("m2"))a.m2=$("m2").value.trim(); if($("m6"))a.m6=$("m6").value.trim();
      if($("m3o"))a.m3o=$("m3o").value.trim(); if($("m4o"))a.m4o=$("m4o").value.trim(); maSave();
    }
    function check(){
      if(step===0){if(a.name.length<3)return "กรอกชื่อ–นามสกุล";if(S.user.role!=="บุคคลทั่วไป"&&a.school.length<3)return "กรอกสถานศึกษา";if(!a.consent)return "ติ๊กรับทราบข้อความยินยอมก่อนไปต่อ";}
      if(step===1){if(!a.m1)return "เลือกฐานที่ประทับใจที่สุด 1 ข้อ";if(a.m1r.length<2)return "บอกเหตุผลสั้น ๆ";}
      if(step===2&&a.m2.length<2)return "พิมพ์สิ่งใหม่ที่ได้เรียนรู้";
      if(step===3){if(!a.m3.length)return "เลือกอย่างน้อย 1 ข้อ";if(a.m3.indexOf("อื่น ๆ (ระบุ)")>=0&&!a.m3o)return "ระบุทักษะอื่น ๆ";}
      if(step===4){if(!a.m4.length)return "เลือก 1–2 ข้อ";if(a.m4.indexOf("อื่น ๆ (ระบุ)")>=0&&!a.m4o)return "ระบุอาชีพอื่น ๆ";}
      if(step===5&&!a.m5.length)return "เลือก 1–2 ข้อ";
      if(step===6&&a.m6.length<2)return "พิมพ์สิ่งที่จะนำกลับไปใช้";
      return "";
    }
    if($("mPrev"))$("mPrev").onclick=function(){collect();go("mission",{step:step-1},true);};
    $("mNext").onclick=function(){
      collect();var e=check();if(e){$("mErr").textContent=e;return;}
      if(step<6){go("mission",{step:step+1},true);return;}
      var btn=this;btn.disabled=true;btn.textContent="กำลังส่งคำตอบ…";
      api("submitMission",{answers:Object.assign({},a,{school:a.school||"ไม่ระบุ"})}).then(function(d){S=d;try{localStorage.removeItem(maKey());}catch(x){}MA=null;stack=[{name:"home",params:{}}];go("missionDone");})
      .catch(function(e2){
        if(e2.code==="BAD_RESPONSE"||e2.code==="ALREADY"){return api("me").then(function(d){if(!d.mission)throw e2;S=d;stack=[{name:"home",params:{}}];go("missionDone");});}
        throw e2;
      }).catch(function(e3){$("mErr").textContent=e3.message;btn.disabled=false;btn.textContent="ส่งคำตอบ";});
    };
  }};
};

      var btn=this;btn.disabled=true;btn.textContent="กำลังส่งคำตอบ…";
      var send=Object.assign({},a,{m4f:a.m4c.indexOf(M2_NONE)>=0?[]:a.m4f});
      api("submitMission",{answers:send}).then(function(d){S=d;try{localStorage.removeItem(ma2Key());}catch(x){}MA2=null;stack=[{name:"home",params:{}}];go("missionDone");})
      .catch(function(e2){if(e2.code==="BAD_RESPONSE"||e2.code==="ALREADY"){return api("me").then(function(d){if(!d.mission)throw e2;S=d;stack=[{name:"home",params:{}}];go("missionDone");});}throw e2;})
      .catch(function(e3){$("mErr").textContent=e3.message;btn.disabled=false;btn.textContent="ส่งคำตอบ";});
    };
  }};
};

/* ===== save image: share sheet → external browser → download ===== */
function inLine(){try{return !!(window.liff&&liff.isInClient&&liff.isInClient());}catch(e){return false;}}
function absUrl(u){try{return new URL(u,location.href).href;}catch(e){return u;}}
function saveImage(src,fileName,ext,hint,btn){
  ext=ext||{};
  function say(m){if(hint)hint.textContent=m;else toast(m,"info");}
  srcToBlob(src).then(function(blob){
    try{var f=new File([blob],fileName,{type:blob.type||"image/jpeg"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){return navigator.share({files:[f],title:fileName}).catch(function(){});}}catch(e){}
    if(inLine()){
      // แอป LINE บันทึกไฟล์จากหน้าเว็บไม่ได้ → เปิดในเบราว์เซอร์ของเครื่องแทน
      if(ext.kind){ if(btn){btn.disabled=true;btn.textContent="กำลังเปิดเบราว์เซอร์…";}
        return api("cardToken").then(function(d){
          liff.openWindow({url:absUrl(location.pathname)+"?card="+d.token+"&kind="+ext.kind,external:true});
          say("เปิดในเบราว์เซอร์แล้ว กด \u201cดาวน์โหลดรูป\u201d ในหน้านั้น หรือแตะค้างที่รูปแล้วเลือกบันทึกรูปภาพ");
        }).catch(function(e){say(e.message);}).then(function(){if(btn){btn.disabled=false;btn.textContent="บันทึกรูปลงเครื่อง";}});
      }
      if(!/^data:/.test(src)){ liff.openWindow({url:absUrl(src),external:true}); say("เปิดรูปในเบราว์เซอร์แล้ว แตะค้างที่รูปแล้วเลือกบันทึกรูปภาพ"); return; }
    }
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fileName;document.body.appendChild(a);a.click();a.remove();
    say('ถ้ายังไม่มีรูปในเครื่อง ให้แตะค้างที่รูปแล้วเลือก "บันทึกรูปภาพ" หรือแคปหน้าจอเก็บไว้');
  }).catch(function(){say('บันทึกด้วยปุ่มไม่ได้ ให้แตะค้างที่รูปแล้วเลือก "บันทึกรูปภาพ" หรือแคปหน้าจอ');});
}

/* ===== card page (เปิดในเบราว์เซอร์ภายนอกเพื่อบันทึกรูป) ===== */
function cardMode(token,kind){
  $title.textContent=kind==="cert"?"วุฒิบัตร":"Passport ID"; $back.hidden=true; $home.hidden=true;
  busy("กำลังเตรียมรูป…");
  fetch(CONFIG.API_URL,{method:"POST",body:JSON.stringify({action:"cardByToken",token:token})}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok) throw new Error(j.message||"เปิดไม่สำเร็จ");
    S=j.data; SUB=S.sub||"";
    if(kind==="cert"&&!S.cert) throw new Error("ยังไม่มีวุฒิบัตร");
    return (kind==="cert"?renderCert():renderIdCard(true)).then(function(u){
      var name=kind==="cert"?"Certificate-"+S.cert.no+".jpg":"PassportID-"+memberId()+".jpg";
      $screen.innerHTML='<div class="cardpage"><img class="cardimg" src="'+u+'" alt="'+esc(name)+'">'+
        '<a class="btn gold" id="cdl" href="'+u+'" download="'+esc(name)+'"><i data-lucide="download"></i>ดาวน์โหลดรูป</a>'+
        '<p class="note" style="text-align:center">iPhone: แตะค้างที่รูป แล้วเลือก \u201cบันทึกไปยังรูปภาพ\u201d<br>Android: กดดาวน์โหลดรูป หรือแตะค้างที่รูปแล้วเลือกดาวน์โหลดรูปภาพ</p></div>';
      if(window.lucide) lucide.createIcons();
    });
  }).catch(function(e){fatal("เปิดรูปไม่สำเร็จ",e.message||"ลองกลับไปที่ LINE แล้วกดบันทึกรูปอีกครั้ง");});
}

/* ===== boot ===== */
function boot(){
  $screen=$("screen");$title=$("barTitle");$back=$("backBtn");$home=$("homeBtn");$phone=$("phone");
  $back.onclick=back; $home.onclick=function(){stack=[];go("home");};
  var q0=new URLSearchParams(location.search);
  if(q0.get("card")){cardMode(q0.get("card"),q0.get("kind")==="cert"?"cert":"id");return;}
  busy("กำลังเชื่อมต่อ LINE…");
  if(!window.liff){fatal("โหลดระบบไม่สำเร็จ","ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่");return;}
  if(CONFIG.API_URL.indexOf("http")!==0){fatal("ยังไม่ได้ตั้งค่าระบบ","ผู้ดูแลต้องใส่ API_URL ในไฟล์ index.html");return;}
  liff.init({liffId:CONFIG.LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
    var q=new URLSearchParams(location.search);
    walkin=q.get("walkin")==="1";
    if(q.get("s")&&q.get("k")) pending={station:Number(q.get("s")),key:q.get("k")};
    var start=q.get("p");
    try{ var tok=liff.getDecodedIDToken(); SUB=tok&&tok.sub||""; }catch(e){}
    var ok={mission:1,missionDone:1,passport:1,missions:1,rewards:1,city:1,admission:1,scan:1,cert:1,schedule:1,map:1,eval:1,journey:1,programs:1,idcard:1};
    var cached=pending?null:recall();
    if(cached){
      // แสดงข้อมูลล่าสุดในเครื่องทันที แล้วอัปเดตจากระบบเบื้องหลัง
      S=cached; stack=[];
      if(start&&ok[start]){stack.push({name:"home",params:{}});go(start);}else go("home");
      try{history.replaceState(null,"",location.pathname);}catch(e){}
      lastFetch=Date.now();
      api("me").then(function(d){
        S=d; try{sessionStorage.removeItem("fp-relogin");}catch(e){}
        if(!S.registered){stack=[];go("register");return;}
        var c=stack[stack.length-1];
        if(c&&{home:1,passport:1,missions:1,city:1}[c.name]&&!$phone.querySelector(".scrim")) draw();
      }).catch(function(){});
      return;
    }
    busy("กำลังโหลดข้อมูลของคุณ…");
    return api("me").then(function(d){
      S=d; try{sessionStorage.removeItem("fp-relogin");}catch(e){}
      try{history.replaceState(null,"",location.pathname);}catch(e){}
      if(!S.registered){stack=[];go("register");return;}
      if(pending){var p=pending;pending=null;stack=[{name:"home",params:{}}];doScan(p);return;}
      stack=[];
      if(start&&ok[start]){stack.push({name:"home",params:{}});go(start);}else go("home");
    });
  }).catch(function(e){fatal("เปิดระบบไม่สำเร็จ",e&&e.message?e.message:"ลองปิดแล้วเปิดใหม่ผ่านแอป LINE");});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
